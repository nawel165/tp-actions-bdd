name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer PostgreSQL
        run: bash db/setup.sh

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt
        working-directory: python-app

      - name: Executer les tests
        run: pytest -v
        working-directory: python-app

  node:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer PostgreSQL
        run: bash db/setup.sh

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dependances
        run: npm ci
        working-directory: node-app

      - name: Executer les tests
        run: npm test
        working-directory: node-app

  java:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer PostgreSQL
        run: bash db/setup.sh

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Executer les tests Java
        run: mvn -B test
        working-directory: java-app

  php:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer PostgreSQL
        run: bash db/setup.sh

      - name: Installer PHP et Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          tools: composer:v2

      - name: Installer les dependances PHP
        run: composer install --no-interaction --prefer-dist
        working-directory: php-app

      - name: Executer les tests PHP
        run: composer test
        working-directory: php-app